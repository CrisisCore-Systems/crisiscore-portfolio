<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Data Boundary Map</title>
<desc id="desc">Five node boundary map for collect, store, log, export, and claim.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<rect class="grid" width="1600" height="900"/>
<rect class="micro" width="1600" height="900"/>

<text class="eyebrow" x="96" y="106" font-size="22">VISUAL ASSET 02</text>
<text class="title" x="96" y="164" font-size="58">Data Boundary Map</text>
<text class="body" x="96" y="205" font-size="30">Use near services, audit scope, or health app review pages.</text>
<line x1="96" y1="230" x2="1504" y2="230" stroke="#233047" stroke-width="1.4"/>
<text class="tiny" x="96" y="820" font-size="18">CRISISCORE SYSTEMS / PROTECTIVE COMPUTING</text>
<text class="tiny" x="1218" y="820" font-size="18">NO AD TECH / JS DEGRADES / EVIDENCE FIRST</text>
<circle cx="1230" cy="200" r="220" fill="url(#cyanGlow)"/><circle cx="360" cy="680" r="250" fill="url(#greenGlow)"/><path d="M210 515 C410 255 665 670 830 440 S1120 275 1300 540" fill="none" stroke="#4de1ff" stroke-width="3" stroke-opacity=".45"/><g>
<circle cx="230" cy="420" r="58" fill="#0f172a" stroke="#ff4d6d" stroke-width="2.5" filter="url(#softGlow)"/>
<text class="label" x="230" y="428" text-anchor="middle" font-size="22">COLLECT</text>
<text class="tiny" x="230" y="512" text-anchor="middle" font-size="16">01 / BOUNDARY</text>
</g><g>
<circle cx="480" cy="540" r="58" fill="#0f172a" stroke="#ffc857" stroke-width="2.5" filter="url(#softGlow)"/>
<text class="label" x="480" y="548" text-anchor="middle" font-size="22">STORE</text>
<text class="tiny" x="480" y="632" text-anchor="middle" font-size="16">02 / BOUNDARY</text>
</g><g>
<circle cx="735" cy="400" r="58" fill="#0f172a" stroke="#4de1ff" stroke-width="2.5" filter="url(#softGlow)"/>
<text class="label" x="735" y="408" text-anchor="middle" font-size="22">LOG</text>
<text class="tiny" x="735" y="492" text-anchor="middle" font-size="16">03 / BOUNDARY</text>
</g><g>
<circle cx="980" cy="560" r="58" fill="#0f172a" stroke="#68ffb0" stroke-width="2.5" filter="url(#softGlow)"/>
<text class="label" x="980" y="568" text-anchor="middle" font-size="22">EXPORT</text>
<text class="tiny" x="980" y="652" text-anchor="middle" font-size="16">04 / BOUNDARY</text>
</g><g>
<circle cx="1220" cy="420" r="58" fill="#0f172a" stroke="#a78bfa" stroke-width="2.5" filter="url(#softGlow)"/>
<text class="label" x="1220" y="428" text-anchor="middle" font-size="22">CLAIM</text>
<text class="tiny" x="1220" y="512" text-anchor="middle" font-size="16">05 / BOUNDARY</text>
</g><rect x="150" y="645" width="1300" height="86" rx="22" fill="#0b1220" stroke="#243148"/>
<text class="body" x="190" y="698" font-size="26">Map what crosses the line before a buyer, patient, auditor, or regulator does it for you.</text>
</svg>