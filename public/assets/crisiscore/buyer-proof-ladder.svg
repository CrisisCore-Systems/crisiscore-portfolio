<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Buyer Proof Ladder</title>
<desc id="desc">Five step proof ladder from live product changed to same lens applied.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<rect class="grid" width="1600" height="900"/>
<rect class="micro" width="1600" height="900"/>

<text class="eyebrow" x="96" y="106" font-size="22">VISUAL ASSET 04</text>
<text class="title" x="96" y="164" font-size="58">Buyer Proof Ladder</text>
<text class="body" x="96" y="205" font-size="30">For proof page, case study, or founder credibility sections.</text>
<line x1="96" y1="230" x2="1504" y2="230" stroke="#233047" stroke-width="1.4"/>
<text class="tiny" x="96" y="820" font-size="18">CRISISCORE SYSTEMS / PROTECTIVE COMPUTING</text>
<text class="tiny" x="1218" y="820" font-size="18">NO AD TECH / JS DEGRADES / EVIDENCE FIRST</text>
<circle cx="250" cy="220" r="220" fill="url(#greenGlow)"/><circle cx="1370" cy="710" r="260" fill="url(#cyanGlow)"/><g>
<rect x="240" y="300" width="880" height="58" rx="16" fill="#0f172a" stroke="#26364f"/>
<circle cx="276" cy="329" r="18" fill="#68ffb0"/>
<text class="tiny" x="276" y="335" text-anchor="middle" font-size="15" fill="#06100c">1</text>
<text class="label" x="316" y="337" font-size="24">Live product changed</text>
<text class="body" x="635" y="337" font-size="20">PainTracker behavior, not just copy</text>
</g><g>
<rect x="335" y="382" width="880" height="58" rx="16" fill="#0f172a" stroke="#26364f"/>
<circle cx="371" cy="411" r="18" fill="#68ffb0"/>
<text class="tiny" x="371" y="417" text-anchor="middle" font-size="15" fill="#06100c">2</text>
<text class="label" x="411" y="419" font-size="24">Claims narrowed</text>
<text class="body" x="730" y="419" font-size="20">ProofVault reduces unearned guarantees</text>
</g><g>
<rect x="430" y="464" width="880" height="58" rx="16" fill="#0f172a" stroke="#26364f"/>
<circle cx="466" cy="493" r="18" fill="#68ffb0"/>
<text class="tiny" x="466" y="499" text-anchor="middle" font-size="15" fill="#06100c">3</text>
<text class="label" x="506" y="501" font-size="24">Artifacts published</text>
<text class="body" x="825" y="501" font-size="20">Threat models, packets, release evidence</text>
</g><g>
<rect x="525" y="546" width="880" height="58" rx="16" fill="#0f172a" stroke="#26364f"/>
<circle cx="561" cy="575" r="18" fill="#68ffb0"/>
<text class="tiny" x="561" y="581" text-anchor="middle" font-size="15" fill="#06100c">4</text>
<text class="label" x="601" y="583" font-size="24">Method formalized</text>
<text class="body" x="920" y="583" font-size="20">Protective Computing canon and rubric</text>
</g><g>
<rect x="620" y="628" width="880" height="58" rx="16" fill="#0f172a" stroke="#26364f"/>
<circle cx="656" cy="657" r="18" fill="#68ffb0"/>
<text class="tiny" x="656" y="663" text-anchor="middle" font-size="15" fill="#06100c">5</text>
<text class="label" x="696" y="665" font-size="24">Same lens applied</text>
<text class="body" x="1015" y="665" font-size="20">Buyer gets the inspection path</text>
</g><path d="M230 330 L1140 690" fill="none" stroke="#4de1ff" stroke-opacity=".24" stroke-width="3"/>
</svg>