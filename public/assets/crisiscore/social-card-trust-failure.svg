<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
<title id="title">Social Card Trust Failure</title>
<desc id="desc">Square social card for CrisisCore Systems 3 point risk read.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1080" height="1080"/>
<rect class="grid" width="1080" height="1080"/>
<rect class="micro" width="1080" height="1080"/>

<circle cx="860" cy="190" r="300" fill="url(#cyanGlow)"/>
<circle cx="225" cy="850" r="340" fill="url(#greenGlow)"/>
<text class="eyebrow" x="80" y="116" font-size="24">CRISISCORE SYSTEMS</text>
<text class="title" x="80" y="230" font-size="74">Find the trust</text>
<text class="title" x="80" y="315" font-size="74">failure before</text>
<text class="title" x="80" y="400" font-size="74">buyers do.</text>
<rect x="80" y="490" width="920" height="250" rx="34" class="panel2"/>
<text class="label" x="130" y="565" font-size="34">3 point risk read</text>
<text class="body" x="130" y="625" font-size="28">Product URL. Launch stage. One concern.</text>
<text class="body" x="130" y="682" font-size="28">Top gaps. First fix. No theater.</text>
<line x1="130" y1="785" x2="950" y2="785" stroke="#68ffb0" stroke-opacity=".45"/>
<text class="tiny" x="80" y="975" font-size="24">crisiscore-systems.ca</text>

</svg>