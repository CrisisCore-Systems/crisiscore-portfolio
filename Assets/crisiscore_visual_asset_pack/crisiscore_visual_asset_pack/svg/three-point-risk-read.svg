<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">3 Point Risk Read</title>
<desc id="desc">Three card CTA diagram explaining visible gap, why it matters, and first fix.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<rect class="grid" width="1600" height="900"/>
<rect class="micro" width="1600" height="900"/>

<text class="eyebrow" x="96" y="106" font-size="22">VISUAL ASSET 03</text>
<text class="title" x="96" y="164" font-size="58">3 Point Risk Read</text>
<text class="body" x="96" y="205" font-size="30">A CTA graphic for cold outreach, homepage inserts, and service cards.</text>
<line x1="96" y1="230" x2="1504" y2="230" stroke="#233047" stroke-width="1.4"/>
<text class="tiny" x="96" y="820" font-size="18">CRISISCORE SYSTEMS / PROTECTIVE COMPUTING</text>
<text class="tiny" x="1218" y="820" font-size="18">NO AD TECH / JS DEGRADES / EVIDENCE FIRST</text>
<circle cx="1280" cy="210" r="220" fill="url(#cyanGlow)"/><circle cx="310" cy="730" r="210" fill="url(#greenGlow)"/><rect x="150" y="345" width="385" height="245" rx="28" class="panel2"/>
<text class="eyebrow" x="186" y="403" font-size="18">01</text>
<text class="label" x="186" y="450" font-size="30">VISIBLE GAP</text>
<text class="body" x="186" y="495" font-size="20">What would make a visitor hesitate before calling,</text>
<text class="body" x="186" y="528" font-size="20"> booking, or submitting info?</text>
<line x1="186" y1="555" x2="480" y2="555" stroke="#4de1ff" stroke-opacity=".35"/><rect x="590" y="345" width="385" height="245" rx="28" class="panel2"/>
<text class="eyebrow" x="626" y="403" font-size="18">02</text>
<text class="label" x="626" y="450" font-size="30">WHY IT MATTERS</text>
<text class="body" x="626" y="495" font-size="20">Buyer trust, privacy clarity, intake safety, or cr</text>
<text class="body" x="626" y="528" font-size="20">edibility drag.</text>
<line x1="626" y1="555" x2="920" y2="555" stroke="#4de1ff" stroke-opacity=".35"/><rect x="1030" y="345" width="385" height="245" rx="28" class="panel2"/>
<text class="eyebrow" x="1066" y="403" font-size="18">03</text>
<text class="label" x="1066" y="450" font-size="30">FIRST FIX</text>
<text class="body" x="1066" y="495" font-size="20">Smallest useful correction. No slide deck. No padd</text>
<text class="body" x="1066" y="528" font-size="20">ing.</text>
<line x1="1066" y1="555" x2="1360" y2="555" stroke="#4de1ff" stroke-opacity=".35"/><text class="title" x="800" y="690" text-anchor="middle" font-size="44">Send URL + stage + one concern</text>
<text class="body" x="800" y="735" text-anchor="middle" font-size="25">Return path: no fit, fix sprint, teardown, or full review.</text>
</svg>