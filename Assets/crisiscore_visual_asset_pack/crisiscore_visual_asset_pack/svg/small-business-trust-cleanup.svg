<text class="tiny" x="96" y="820" font-size="18">CRISISCORE SYSTEMS / PROTECTIVE COMPUTING</text>
<text class="tiny" x="1218" y="820" font-size="18">NO AD TECH / JS DEGRADES / EVIDENCE FIRST</text>
<circle cx="1320" cy="190" r="260" fill="url(#cyanGlow)"/><circle cx="245" cy="730" r="280" fill="url(#greenGlow)"/><rect x="175" y="305" width="660" height="420" rx="28" fill="#0b1220" stroke="#26364f"/>
<rect x="175" y="305" width="660" height="62" rx="28" fill="#111a2d"/>
<circle cx="225" cy="337" r="9" fill="#ff4d6d"/><circle cx="255" cy="337" r="9" fill="#ffc857"/><circle cx="285" cy="337" r="9" fill="#68ffb0"/>
<rect x="230" y="410" width="470" height="36" rx="8" fill="#17223a"/>
<rect x="230" y="472" width="360" height="36" rx="8" fill="#17223a"/>
<rect x="230" y="535" width="520" height="88" rx="14" fill="#111827" stroke="#334155"/>
<text class="tiny" x="250" y="590" font-size="18">FORM ASKS FOR PERSONAL INFO</text>
<text class="tiny" x="230" y="680" font-size="16">© 2018  / POWERED BY TEMPLATE</text>
