<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Small Business Trust Cleanup</title>
<desc id="desc">Local small business website trust cleanup graphic with form and credibility warnings.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<rect class="grid" width="1600" height="900"/>
<rect class="micro" width="1600" height="900"/>

<text class="eyebrow" x="96" y="106" font-size="22">VISUAL ASSET 05</text>
<text class="title" x="96" y="164" font-size="58">Small Business Trust Cleanup</text>
<text class="body" x="96" y="205" font-size="30">Built for the new local outreach offer: motels, trades, clinics, salons.</text>
