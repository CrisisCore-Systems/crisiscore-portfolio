<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Defensibility Packet Flow</title>
<desc id="desc">Four stage defensibility packet flow from boundary statement to roadmap.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<rect class="grid" width="1600" height="900"/>
<rect class="micro" width="1600" height="900"/>

<text class="eyebrow" x="96" y="106" font-size="22">VISUAL ASSET 06</text>
<text class="title" x="96" y="164" font-size="58">Defensibility Packet Flow</text>
<text class="body" x="96" y="205" font-size="30">For trust hardening review deliverables and proof of work sections.</text>
<line x1="96" y1="230" x2="1504" y2="230" stroke="#233047" stroke-width="1.4"/>
<text class="tiny" x="96" y="820" font-size="18">CRISISCORE SYSTEMS / PROTECTIVE COMPUTING</text>
<text class="tiny" x="1218" y="820" font-size="18">NO AD TECH / JS DEGRADES / EVIDENCE FIRST</text>
<circle cx="1340" cy="250" r="240" fill="url(#cyanGlow)"/><circle cx="250" cy="670" r="260" fill="url(#greenGlow)"/><rect x="130" y="400" width="300" height="185" rx="24" class="panel2"/>
<text class="eyebrow" x="158" y="445" font-size="16">01</text>
<text class="label" x="158" y="486" font-size="25">Boundary statement</text>
<text class="body" x="158" y="526" font-size="18">Define what the product should and sh</text>
<text class="body" x="158" y="554" font-size="18">ould not collect.</text><path d="M434 492 C475 472 466 520 486 492" fill="none" stroke="#4de1ff" stroke-opacity=".45" stroke-width="3" marker-end="url(#arrow)"/><rect x="490" y="485" width="300" height="185" rx="24" class="panel2"/>
<text class="eyebrow" x="518" y="530" font-size="16">02</text>
<text class="label" x="518" y="571" font-size="25">Data inventory</text>
<text class="body" x="518" y="611" font-size="18">Map categories, purpose, retention, a</text>
<text class="body" x="518" y="639" font-size="18">nd exposure.</text><path d="M794 577 C835 557 826 435 846 407" fill="none" stroke="#4de1ff" stroke-opacity=".45" stroke-width="3" marker-end="url(#arrow)"/><rect x="850" y="400" width="300" height="185" rx="24" class="panel2"/>
<text class="eyebrow" x="878" y="445" font-size="16">03</text>
<text class="label" x="878" y="486" font-size="25">Risk ranking</text>
<text class="body" x="878" y="526" font-size="18">Severity, blast radius, fix effort, a</text>
<text class="body" x="878" y="554" font-size="18">nd closure criteria.</text><path d="M1154 492 C1195 472 1186 520 1206 492" fill="none" stroke="#4de1ff" stroke-opacity=".45" stroke-width="3" marker-end="url(#arrow)"/><rect x="1210" y="485" width="300" height="185" rx="24" class="panel2"/>
<text class="eyebrow" x="1238" y="530" font-size="16">04</text>
<text class="label" x="1238" y="571" font-size="25">Roadmap</text>
<text class="body" x="1238" y="611" font-size="18">Now, next, later. Decision-ready and </text>
<text class="body" x="1238" y="639" font-size="18">bounded.</text><rect x="420" y="665" width="760" height="60" rx="18" fill="#101827" stroke="#68ffb0" stroke-opacity=".55"/><text class="label" x="800" y="704" text-anchor="middle" font-size="28">Explicit evidence beats vague assurance.</text>
</svg>