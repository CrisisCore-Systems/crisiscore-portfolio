<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Trust Failure Radar</title>
<desc id="desc">Abstract radar diagram showing product trust risks such as over collection, weak consent, cloud default and offline break.</desc>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070c"/>
    <stop offset="0.55" stop-color="#08111f"/>
    <stop offset="1" stop-color="#030508"/>
  </linearGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#4de1ff" stop-opacity="0.42"/>
    <stop offset="1" stop-color="#4de1ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#68ffb0" stop-opacity="0.36"/>
    <stop offset="1" stop-color="#68ffb0" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d293b" stroke-opacity="0.42" stroke-width="1"/>
  </pattern>
  <pattern id="micro" width="12" height="12" patternUnits="userSpaceOnUse">
    <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
  </pattern>
  <style>
    .bg { fill: url(#bgGrad); }
    .grid { fill: url(#grid); opacity:.55; }
    .micro { fill: url(#micro); opacity:.85; }
    .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -1.8px; fill: #f8fafc; }
    .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: 2.8px; text-transform: uppercase; fill: #68ffb0; }
    .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #e5edf9; }
    .body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 500; fill: #9aa8bd; }
    .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; fill: #94a3b8; }
    .panel { fill: #0c1220; stroke: #233047; stroke-width: 1.3; }
    .panel2 { fill: #0f172a; stroke: #2a3b55; stroke-width: 1.2; }
    .cyan { stroke: #4de1ff; } .green { stroke:#68ffb0; } .amber { stroke:#ffc857; } .red { stroke:#ff4d6d; } .violet { stroke:#a78bfa; }
  </style>
</defs>
<rect class="bg" width="1600" height="900"/>
<rect class="grid" width="1600" height="900"/>
<rect class="micro" width="1600" height="900"/>

<text class="eyebrow" x="96" y="106" font-size="22">VISUAL ASSET 01</text>
<text class="title" x="96" y="164" font-size="58">Trust Failure Radar</text>
<text class="body" x="96" y="205" font-size="30">For hero sections, proof pages, and risk review cards.</text>
<line x1="96" y1="230" x2="1504" y2="230" stroke="#233047" stroke-width="1.4"/>
<text class="tiny" x="96" y="820" font-size="18">CRISISCORE SYSTEMS / PROTECTIVE COMPUTING</text>
<text class="tiny" x="1218" y="820" font-size="18">NO AD TECH / JS DEGRADES / EVIDENCE FIRST</text>

<circle cx="1330" cy="165" r="160" fill="url(#cyanGlow)"/>
<circle cx="270" cy="690" r="220" fill="url(#greenGlow)"/>
<g><circle cx="800" cy="510" r="90" fill="none" stroke="#4de1ff" stroke-opacity="0.32" stroke-width="2"/><circle cx="800" cy="510" r="160" fill="none" stroke="#4de1ff" stroke-opacity="0.26" stroke-width="2"/><circle cx="800" cy="510" r="230" fill="none" stroke="#4de1ff" stroke-opacity="0.2" stroke-width="2"/><circle cx="800" cy="510" r="300" fill="none" stroke="#4de1ff" stroke-opacity="0.14" stroke-width="2"/><line x1="800" y1="510" x2="1115.0" y2="510.0" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="1072.8" y2="667.5" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="957.5" y2="782.8" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="800.0" y2="825.0" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="642.5" y2="782.8" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="527.2" y2="667.5" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="485.0" y2="510.0" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="527.2" y2="352.5" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="642.5" y2="237.2" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="800.0" y2="195.0" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="957.5" y2="237.2" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><line x1="800" y1="510" x2="1072.8" y2="352.5" stroke="#4de1ff" stroke-opacity="0.13" stroke-width="1"/><circle cx="800" cy="510" r="24" fill="#68ffb0" filter="url(#softGlow)"/>
<circle cx="800" cy="510" r="8" fill="#06100c"/>
<path d="M800 510 L900 392 L994 548 L768 664 L610 538 Z" fill="#4de1ff" fill-opacity="0.10" stroke="#4de1ff" stroke-opacity="0.55" stroke-width="2"/><circle cx="710" cy="418" r="10" fill="#ff4d6d" filter="url(#softGlow)"/><text class="tiny" x="728" y="423" font-size="17">OVER COLLECTION</text><circle cx="900" cy="392" r="10" fill="#ffc857" filter="url(#softGlow)"/><text class="tiny" x="918" y="397" font-size="17">WEAK CONSENT</text><circle cx="994" cy="548" r="10" fill="#4de1ff" filter="url(#softGlow)"/><text class="tiny" x="1012" y="553" font-size="17">CLOUD DEFAULT</text><circle cx="768" cy="664" r="10" fill="#a78bfa" filter="url(#softGlow)"/><text class="tiny" x="786" y="669" font-size="17">OFFLINE BREAK</text><circle cx="610" cy="538" r="10" fill="#68ffb0" filter="url(#softGlow)"/><text class="tiny" x="628" y="543" font-size="17">CLAIM GAP</text></g>
<rect x="1015" y="318" width="380" height="285" rx="24" class="panel"/>
<text class="label" x="1050" y="365" font-size="26">Signal priority</text>
<text class="body" x="1050" y="415" font-size="22">1. Buyer visible risk</text>
<text class="body" x="1050" y="456" font-size="22">2. Data boundary failure</text>
<text class="body" x="1050" y="497" font-size="22">3. Recovery under pressure</text>
<text class="body" x="1050" y="538" font-size="22">4. Claim cannot be defended</text>
<line x1="1050" y1="565" x2="1360" y2="565" stroke="#334155"/>
<text class="tiny" x="1050" y="592" font-size="16">FIRST READ: TOP 3 DEFENSIBILITY GAPS</text>

</svg>